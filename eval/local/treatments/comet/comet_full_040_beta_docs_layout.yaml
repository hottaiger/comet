# Full comet skill treatment using the live worktree Skill bundle and the docs-based
# OpenSpec artifact layout introduced by the unified artifact layout work.
COMET_FULL_040_BETA_DOCS_LAYOUT:
  description: "Full comet skill (workflow 0.4.0-beta.4 live bundle) with docs-based OpenSpec layout, OpenSpec, and Superpowers dependencies"
  claude_md: |
    For this treatment, create and use workflow change artifacts under `docs/openspec/changes/<change-name>/` instead of the legacy `openspec/changes/<change-name>/` root.

    Before reading or writing change-local files, resolve the live change directory with `comet openspec status --change "<name>" --json` and treat the returned directory as `<openspec-change-dir>`.
  skills:
    - name: comet
      source: path
      path: ../assets/skills/comet
    - name: comet-open
      source: path
      path: ../assets/skills/comet-open
    - name: comet-design
