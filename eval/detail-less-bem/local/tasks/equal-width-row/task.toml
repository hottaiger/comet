[metadata]
name = "equal-width-row"
description = "Repair a two-card equal-width row without gap or descendant selectors"
difficulty = "medium"
category = "generic"
tags = ["detail-less-bem", "flex", "bem", "layout"]
default_treatments = ["CONTROL", "DETAIL_LESS_BEM"]
instruction_variants = ["direct", "business", "repair"]
image_tag = "detail-less-bem:node20.18.0-python3.11.9-stylelint16.10.0"

[template]
required = []

[environment]
description = "Taro TSX and public Less containing an invalid equal-width entry row."
dockerfile = "environment/Dockerfile"
image_tag = "detail-less-bem:node20.18.0-python3.11.9-stylelint16.10.0"
timeout_sec = 600

[validation]
test_scripts = "test_equal_width_row.py"
target_artifacts = ["src/EqualWidthRow.tsx", "src/equal-width-row.less"]
timeout = 120

[evaluation]
profile = "detail-less-bem"
required_skills = ["detail-less-bem"]
expected_artifacts = ["src/EqualWidthRow.tsx", "src/equal-width-row.less"]
require_skill_invocation = false

[interaction]
mode = "none"
